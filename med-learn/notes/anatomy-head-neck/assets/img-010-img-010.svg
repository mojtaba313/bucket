th="205" height="80" rx="12" class="b"/><text x="862" y="127" text-anchor="middle" class="s">C1 همراه XII</text><text x="862" y="152" text-anchor="middle" class="s">به تیروهایوئید</text><path d="M490 205 C560 150 660 125 735 125" class="mut"/><text x="55" y="420" class="s">فیبرهای C1 مدتی با عصب XII</text><text x="55" y="447" class="s">حرکت می‌کنند؛ سپس جدا می‌شوند.</text><text x="55" y="492" class="s">آنسا: C1 (ریشهٔ فوقانی)</text><text x="55" y="520" class="s">+ C2–C3 (ریشهٔ تحتانی)</text><text x="500" y="570" class="s" text-anchor="middle">در این طرح، شاخه‌های حرکتی به سه عضلهٔ گروهیِ آنسا نشان داده شده‌اند.</text></svg>