هٔ بازویی</text><path d="M240 315 L90 350" stroke="#2563eb" stroke-width="3"/><text x="80" y="380" class="s">ورید ساب‌کلاوین</text><text x="490" y="80" class="s" text-anchor="middle">شریان و شبکه از فضای بین اسکالن قدامی و میانی می‌گذرند؛ ورید در جلوتر قرار دارد.</text></svg>