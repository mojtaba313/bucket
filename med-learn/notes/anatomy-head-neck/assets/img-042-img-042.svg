<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 760"><defs><style>.t{font:25px sans-serif;fill:#17243a}.s{font:18px sans-serif;fill:#334155}.r{stroke:#64748b;stroke-width:8;fill:none;stroke-linecap:round}.tr{stroke:#0f766e;stroke-width:10;fill:none;stroke-linecap:round}.div{stroke:#ca8a04;stroke-width:7;fill:none;stroke-linecap:round}.cord{stroke:#2563eb;stroke-width:10;fill:none;stroke-linecap:round}.end{stroke:#be185d;stroke-width:7;fill:none;stroke-linecap:round}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.pill{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}</style></defs><rect x="10" y="10" width="1130" height="740" rx="25" fill="#f8fafc" stroke="#cbd5e1"/><text x="575" y="48" text-anchor="middle" class="t" font-weight="bold">شبکهٔ بازویی: از ریشه تا شاخهٔ انتهایی</text><g class="s"><text x="95" y="105">ریشه‌ها</text><text x="300" y="105">تنه‌ها</text><text x="490" y="105">تقسیم‌ها</text><text x="690" y="105">طناب‌ها</text><text x="955" y="105">شاخه‌ها</text></g>
<path d="M110 145 L280 185 M110 215 L280 185 M110 285 L280 285 M110 355 L280 405 M110 425 L280 405" class="r"/><text x="55" y="151" class="s">C5</text><text x="55" y="221" class="s">C6</text><text x="55" y="291" class="s">C7</text><text x="55" y="361" class="s">C8</text><text x="55" y="431" class="s">T1</text>
<path d="M280 185 L420 205 M280 285 L420 285 M280 405 L420 385" class="tr"/><text x="315" y="175" class="s">فوقانی</text><text x="315" y="275" class="s">میانی</text><text x="315" y="395" class="s">تحتانی</text>
<path d="M420 205 L555 160 M420 205 L555 230 M420 285 L555 270 M420 285 L555 340 M420 385 L555 390 M420 385 L555 465" class="div"/><text x="465" y="150" class="s">قدامی</text><text x="465" y="490" class="s">خلفی</text>
<path d="M555 160 L690 235 M555 270 L690 235 M555 230 L690 350 M555 340 L690 350 M555 390 L690 465 M555 465 L690 465" class="cord"/><text x="700" y="224" class="s">طناب خارجی</text><text x="700" y="340" class="s">طناب خلفی</text><text x="700" y="455" class="s">طناب داخلی</text>
<!-- lateral cord branches -->
<path d="M690 235 L895 160 M690 235 L895 210 M690 235 L895 260" class="end"/><text x="910" y="166" class="s">عضلانی‌پوستی</text><text x="910" y="216" class="s">سینه‌ای خارجی</text><text x="910" y="266" class="s">ریشهٔ خارجی مدین</text>
<!-- posterior cord branches -->
<path d="M690 350 L895 330 M690 350 L895 380 M690 350 L895 430" class="end"/><text x="910" y="336" class="s">آگزیلاری</text><text x="910" y="386" class="s">رادیال</text><text x="910" y="436" class="s">توراکودورسال / ساب‌اسکاپولار</text>
<!-- medial cord branches -->
<path d="M690 465 L895 500 M690 465 L895 550 M690 465 L895 600 M690 465 L895 650" class="end"/><text x="910" y="506" class="s">اولنار</text><text x="910" y="556" class="s">سینه‌ای داخلی</text><text x="910" y="606" class="s">پوستی داخلی بازو</text><text x="910" y="656" class="s">پوستی داخلی ساعد</text>
<!-- median nerve convergence -->
<path d="M895 260 C860 300 845 330 820 365" class="end"/><path d="M895 700 C850 650 845 430 820 390" class="end"/><rect x="730" y="365" width="170" height="52" rx="12" class="pill"/><text x="815" y="398" class="s" text-anchor="middle">عصب مدین</text><text x="575" y="705" class="s" text-anchor="middle">طناب خارجی و داخلی دو ریشهٔ عصب مدین را می‌سازند؛ طناب خلفی ریشه‌ای برای مدین نمی‌دهد.</text>
<rect x="45" y="515" width="600" height="125" rx="14" class="box"/><text x="345" y="550" class="s" text-anchor="middle">شاخه‌های ریشه‌ای: دورسال اسکاپولار (C5) و توراسیک بلند (C5–C7)</text><text x="345" y="584" class="s" text-anchor="middle">شاخه‌های تنهٔ فوقانی: سوپرااسکاپولار و عصب به ساب‌کلاویوس</text><text x="345" y="616" class="s" text-anchor="middle">از تقسیم‌ها در الگوی معمول شاخهٔ نام‌دار جدا نمی‌شود.</text></svg>