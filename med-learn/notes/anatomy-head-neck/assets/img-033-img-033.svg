<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590"><defs><style>.t{font:24px sans-serif;fill:#17243a}.s{font:18px sans-serif;fill:#334155}.thor{fill:none;stroke:#0f766e;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.right{fill:none;stroke:#16a34a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.ven{fill:none;stroke:#2563eb;stroke-width:16;stroke-linecap:round}.body{fill:#dbeafe;stroke:#64748b;stroke-width:3}.green{fill:#bbf7d0;stroke:#16a34a;stroke-width:2}</style></defs><rect x="10" y="10" width="980" height="570" rx="24" fill="#f8fafc" stroke="#cbd5e1"/><text x="500" y="48" text-anchor="middle" class="t" font-weight="bold">قلمرو تخلیهٔ مجاری لنفاوی — نمای قدامی بدن</text><ellipse cx="500" cy="120" rx="48" ry="55" class="body"/><path d="M445 180 Q385 185 365 230 L340 405 Q355 435 395 425 L420 300 L430 455 Q500 485 570 455 L580 300 L605 425 Q645 435 660 405 L635 230 Q615 185 555 180Z" class="body"/><path d="M445 190 Q385 190 365 240 L350 330 Q390 350 450 330 L480 230 L480 185Z" class="green"/><path d="M445 185 Q385 185 365 230 L340 405 Q355 435 395 425 L420 300 L430 455 Q500 485 570 455 L580 300 L605 425 Q645 435 660 405 L635 230 Q615 185 555 180Z" fill="none" stroke="#64748b" stroke-width="3"/><text x="395" y="260" class="s" text-anchor="middle">ربع فوقانی</text><text x="395" y="284" class="s" text-anchor="middle">راست</text><text x="540" y="345" class="s" text-anchor="middle">سایر نواحی بدن</text><path d="M500 455 C500 375 500 280 520 220 C540 160 600 145 650 150" class="thor"/><path d="M390 300 C350 255 360 205 390 180" class="right"/><path d="M630 150 L710 150" class="ven"/><path d="M290 180 L390 180" class="ven"/><text x="740" y="145" class="s">زاویهٔ وریدی چپ</text><text x="180" y="175" class="s">زاویهٔ وریدی راست</text><path d="M650 150 L700 150" stroke="#0f766e" stroke-width="4"/><path d="M390 180 L330 180" stroke="#16a34a" stroke-width="4"/><text x="700" y="195" class="s">مجرای سینه‌ای</text><text x="700" y="220" class="s">از بیشتر بدن</text><text x="75" y="245" class="s">مجرای لنفاوی راست</text><text x="75" y="270" class="s">از ربع فوقانی راست</text><rect x="80" y="465" width="390" height="74" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="275" y="495" class="s" text-anchor="middle">آبی: قلمرو غالب مجرای سینه‌ای</text><text x="275" y="520" class="s" text-anchor="middle">به‌جز ربع فوقانی راست</text><rect x="520" y="465" width="390" height="74" rx="12" fill="#ecfdf5" stroke="#86efac"/><text x="715" y="495" class="s" text-anchor="middle">سبز: ربع فوقانی راست بدن</text><text x="715" y="520" class="s" text-anchor="middle">سر و گردن، قفسهٔ سینه و اندام فوقانی راست</text><text x="500" y="565" class="s" text-anchor="middle">در نمای قدامی، سمت راست بدن در سمت چپ تصویر قرار می‌گیرد.</text></svg>