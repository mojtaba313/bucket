<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680"><defs><style>.t{font:24px sans-serif;fill:#17243a}.s{font:19px sans-serif;fill:#334155}.artery{fill:none;stroke:#dc2626;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.branch{fill:none;stroke:#ef4444;stroke-width:8;stroke-linecap:round}.box{fill:#fff7ed;stroke:#f97316;stroke-width:2}.head{fill:#fee2e2;stroke:#dc2626;stroke-width:2}</style></defs><rect x="10" y="10" width="1080" height="660" rx="26" fill="#fff" stroke="#cbd5e1"/><text x="550" y="48" text-anchor="middle" class="t" font-weight="bold">درخت شاخه‌های شریان ساب‌کلاوین — الگوی شایع</text><path d="M120 350 C250 350 315 350 420 350 C500 350 620 350 970 350" class="artery"/><path d="M420 350 C420 220 375 160 310 105" class="branch"/><path d="M465 350 C490 455 500 515 520 570" class="branch"/><path d="M540 350 C600 225 650 180 720 135" class="branch"/><path d="M650 350 C690 410 720 440 770 490" class="branch"/><path d="M720 350 C785 275 830 260 895 235" class="branch"/><text x="105" y="320" class="s">منشأ</text><text x="850" y="320" class="s">به سمت خارج</text><line x1="575" y1="270" x2="575" y2="430" stroke="#64748b" stroke-width="4" stroke-dasharray="8 7"/><text x="295" y="390" class="s" text-anchor="middle">قسمت اول</text><text x="575" y="390" class="s" text-anchor="middle">قسمت دوم</text><text x="850" y="390" class="s" text-anchor="middle">قسمت سوم</text><rect x="95" y="75" width="250" height="74" rx="12" class="box"/><text x="220" y="105" text-anchor="middle" class="s">شریان مهره‌ای</text><text x="220" y="130" text-anchor="middle" class="s">ورود معمولاً در C6</text><rect x="395" y="545" width="260" height="90" rx="12" class="box"/><text x="525" y="580" text-anchor="middle" class="s">شریان توراسیک داخلی</text><text x="525" y="607" text-anchor="middle" class="s">به دیوارهٔ قدامی قفسهٔ سینه</text><rect x="650" y="70" width="310" height="110" rx="12" class="box"/><text x="805" y="104" text-anchor="middle" class="s">تنهٔ تیروسرویکال</text><text x="805" y="132" text-anchor="middle" class="s">تیروئیدی تحتانی، عرضی گردنی،</text><text x="805" y="158" text-anchor="middle" class="s">فوق‌کتفی (الگوی معمول)</text><rect x="760" y="500" width="270" height="98" rx="12" class="box"/><text x="895" y="535" text-anchor="middle" class="s">تنهٔ کوستوسرویکال</text><text x="895" y="563" text-anchor="middle" class="s">گردنی عمقی + بین‌دنده‌ای فوقانی</text><rect x="820" y="205" width="220" height="64" rx="12" class="head"/><text x="930" y="245" text-anchor="middle" class="s">دورسال اسکاپولار*</text><text x="550" y="650" text-anchor="middle" class="s">* ممکن است مستقیماً از قسمت سوم یا از شاخهٔ عرضی گردنی منشأ بگیرد؛ تنوع آناتومیک شایع است.</text></svg>